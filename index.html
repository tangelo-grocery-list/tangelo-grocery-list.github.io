<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tangelo — Grocery list on your lock screen</title>
  <meta name="description" content="Tangelo is a grocery list with emojis that also lives on your lock screen. Stop unlocking, keep shopping. Free on Google Play.">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon.svg">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tangelo-grocery-list.github.io/">
  <meta property="og:title" content="Stop unlocking. Keep shopping. — Tangelo grocery list">
  <meta property="og:description" content="A shopping list right on your lock screen.">
  <meta property="og:image" content="https://tangelo-grocery-list.github.io/assets/og-image.jpg?v=3">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Tangelo Grocery List — Stop unlocking. Keep shopping. A shopping list right on your lock screen.">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preload" href="assets/fonts/inter-700.woff2" as="font" type="font/woff2" crossorigin>

  <style>
    /* Inter, self-hosted (SIL OFL 1.1, see assets/fonts/OFL.txt) */
    @font-face {
      font-family: "Inter";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("assets/fonts/inter-400.woff2") format("woff2");
      unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
    }
    @font-face {
      font-family: "Inter";
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url("assets/fonts/inter-500.woff2") format("woff2");
      unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
    }
    @font-face {
      font-family: "Inter";
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url("assets/fonts/inter-700.woff2") format("woff2");
      unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
    }
    :root {
      --bg: #FFFFFF;
      --ink: #000;
      --muted: #545459;
      --yellow: #FFCC34;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); }
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    img { display: block; max-width: 100%; height: auto; }

    .hero {
      position: relative;
      min-height: max(100vh, 680px);
      min-height: max(100svh, 680px);
      overflow: hidden;
      display: flex;
      justify-content: center;
      padding: 0 max(24px, 4vw);
    }
    /* Text and phone travel together as one centered group */
    .stage {
      position: relative;
      display: grid;
      grid-template-columns: auto auto;
      align-items: center;
      column-gap: clamp(48px, 6vw, 112px);
    }

    /* Yellow waves — exported from the Figma frame */
    .wave { position: absolute; z-index: 0; pointer-events: none; }
    .wave--top { top: 0; right: 0; width: min(54%, 72vh); }
    .wave--bottom { display: none; } /* mobile only */
    .wave svg { display: block; width: 100%; height: auto; }

    .copy {
      position: relative; z-index: 2;
      display: flex; flex-direction: column; align-items: flex-start;
      padding: 52px 0;
    }
    .app-head {
      display: flex; align-items: center;
      gap: clamp(14px, 1.4vw, 22px);
      margin-bottom: clamp(20px, 2.2vw, 32px);
    }
    .app-icon {
      width: clamp(64px, 6.2vw, 96px);
      border-radius: 22%;
      box-shadow: 0 2px 4px rgba(0,0,0,.18);
    }
    .app-name {
      font-weight: 700;
      font-size: clamp(1.5rem, 2.4vw, 2.25rem);
      line-height: 1.1;
      letter-spacing: -0.01em;
    }
    .app-name small {
      display: block;
      margin-left: 0.15em; /* optical alignment under the bold "Tangelo" */
      font-weight: 500;
      font-size: 0.6em;
      letter-spacing: 0;
      color: var(--muted);
    }
    h1 {
      font-weight: 700;
      font-size: clamp(2.5rem, 5vw, 4.75rem);
      line-height: 1.12;
      letter-spacing: -0.02em;
    }
    h1 span { display: block; }
    .sub {
      margin-top: clamp(16px, 1.8vw, 24px);
      font-weight: 500;
      font-size: clamp(1.125rem, 1.75vw, 1.625rem);
      line-height: 1.35;
      color: var(--muted);
      text-wrap: balance; /* even lines when it wraps on narrow screens */
    }
    .brand { display: none; } /* mobile only */
    .emoji {
      display: flex; gap: clamp(10px, 1.1vw, 16px);
      margin-top: clamp(20px, 2.2vw, 28px);
      list-style: none;
    }
    .emoji img { width: clamp(32px, 3vw, 44px); }
    .store {
      display: inline-block;
      margin-top: clamp(24px, 2.8vw, 36px);
      border-radius: 10px;
      transition: transform .15s ease;
    }
    .store:hover { transform: translateY(-2px); }
    .store:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
    .store img { width: clamp(190px, 17vw, 250px); }

    .device {
      position: relative; z-index: 1;
      align-self: end;
      justify-self: center;
      width: min(600px, 68vh, 42vw);
      padding-top: 8vh;
    }
    /* the image carries transparent room for the notification shadows; offset it so the phone itself keeps its place.
       It also carries 660px of extra phone below the frame (48.324% of the figure width): hidden below the page edge
       here, shown on mobile where the phone runs down over the yellow floor and on under the system navigation bar
       (safe-area-inset-bottom in Chrome edge-to-edge), so no yellow band shows below the phone. */
    .device img { width: 101.7%; max-width: none; margin-left: -0.5%; margin-bottom: -48.324%; }

    /* Google Play trademark notice: pinned to the very bottom of the page */
    .legal {
      position: absolute; z-index: 3;
      left: 0;
      bottom: calc(20px + env(safe-area-inset-bottom));
      font-size: 12px; line-height: 1.4;
      color: var(--muted);
    }
    .links {
      display: flex; gap: 16px;
      margin-top: 18px;
      font-size: 12px; line-height: 1.4;
    }
    .links a {
      color: var(--muted);
      text-decoration: underline;
      text-decoration-color: rgba(84, 84, 89, .4);
      text-underline-offset: 2px;
    }
    .links a:hover { color: var(--ink); text-decoration-color: currentColor; }
    .links a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 2px; }

    @media (max-width: 820px) {
      .hero {
        min-height: 100vh;
        min-height: 100svh; /* phone and wave always reach the yellow floor at the bottom of the screen */
        --floor: calc(44px + env(safe-area-inset-bottom));
        padding: 0 24px var(--floor);
      }
      /* spare height: 3/4 above the text, 1/4 between the links and the phone */
      .stage { grid-template-columns: 1fr; grid-template-rows: 3fr auto 1fr auto; width: 100%; }
      .copy { grid-row: 2; }
      .device { grid-row: 4; }
      /* no icon on mobile: its space is split above and below the text, so page height stays the same */
      .app-head { display: none; }
      .copy {
        padding: 20px 0 0;
        align-items: center;
        text-align: center;
      }
      /* order on mobile: brand, headline, subline, badge, links */
      .brand {
        order: 0;
        display: flex; align-items: center; gap: 10px;
        font-weight: 700; font-size: 1.25rem; letter-spacing: -0.01em;
      }
      .brand small { margin-left: -4px; font-weight: 500; font-size: 1rem; color: var(--muted); }
      .brand small::before { content: "·"; margin-right: 6px; }
      .brand img { width: 32px; border-radius: 22%; box-shadow: 0 1px 2px rgba(0,0,0,.18); }
      .emoji { display: none; }
      h1 { order: 2; margin-top: 16px; font-size: clamp(2.125rem, 10vw, 2.5rem); }
      .sub { order: 3; }
      .store { order: 4; margin-top: 20px; }
      .store img { width: 156px; } /* ~46px tall: above Google's 28px minimum and a comfortable tap target */
      .links { order: 5; justify-content: center; }
      /* yellow floor under the wave; the phone runs over it to the bottom edge */
      .hero::after {
        content: ""; position: absolute; z-index: 0;
        left: 0; right: 0; bottom: 0; height: var(--floor);
        background: var(--yellow);
      }
      /* legal notice on a translucent white plate over the phone, centered in the 44px floor band below the lock
         and above the system navigation bar (the stage ends where the floor begins, so 22px down = its middle).
         One line while it fits at 10px+; otherwise it wraps to two lines. Always 16px clear of the screen edges. */
      .legal {
        left: -8px; right: -8px; /* stage is inset 24px from the screen: this leaves a 16px gutter */
        width: fit-content; max-width: calc(100% + 16px);
        margin: 0 auto;
        transform: translateY(50%);
        bottom: -22px;
        text-align: center;
        text-wrap: balance;
        font-size: clamp(10px, (100vw - 52px) * 0.0305, 12px);
        line-height: 1.3;
        padding: 3px 10px;
        border-radius: 8px;
        background: rgba(255, 255, 255, .8);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
      }
      .wave--top { display: none; }
      .wave--bottom { display: block; bottom: calc(var(--floor) - 1px); width: 160%; left: -30%; } /* 1px overlap: no hairline seam */
      /* slightly wider than the text column so the phone fills the screen height without a gap above it */
      .device { width: min(calc(100% + 2px), 450px); padding-top: 0; justify-self: center; }
      /* the extra phone below the frame now runs down over the floor to the screen edge (clipped by .hero),
         so the legal notice lies on the screenshot */
    }
    @media (prefers-reduced-motion: reduce) {
      .store { transition: none; }
    }
  </style>
</head>
<body>
  <main class="hero">
    <div class="wave wave--bottom" aria-hidden="true">
      <svg viewBox="0 0 2839 674" preserveAspectRatio="xMinYMax meet"><path d="M2838.25 673.452C1134.94 298.599 114.457 -633.483 -665.981 673.451L2838.25 673.452Z" fill="#FFCC34"/></svg>
    </div>
    <div class="wave wave--top" aria-hidden="true">
      <svg viewBox="0 0 1722 619" preserveAspectRatio="xMaxYMin meet"><path d="M0 0.000610352C1008.71 931.782 2116.57 709.527 2884.68 0L0 0.000610352Z" fill="#FFCC34"/></svg>
    </div>

    <div class="stage">
    <section class="copy">
      <div class="app-head">
        <img class="app-icon" src="assets/icon.svg" width="96" height="96" alt="">
        <span class="app-name">Tangelo<small>Grocery List</small></span>
      </div>
      <div class="brand"><img src="assets/icon.svg" width="32" height="32" alt=""><span>Tangelo</span><small>Grocery List</small></div>
      <h1><span>Stop unlocking.</span> <span>Keep shopping.</span></h1>
      <p class="sub">A shopping list right on your lock&nbsp;screen.</p>
      <ul class="emoji" aria-hidden="true">
        <li><img src="assets/lemon.webp" width="44" height="44" alt=""></li>
        <li><img src="assets/mango.webp" width="44" height="44" alt=""></li>
        <li><img src="assets/blueberries.webp" width="44" height="44" alt=""></li>
        <li><img src="assets/apple.webp" width="44" height="44" alt=""></li>
      </ul>
      <a class="store" href="https://play.google.com/store/apps/details?id=app.grocery.list">
        <img src="assets/google-play-badge.png" width="250" height="74" alt="Get it on Google Play">
      </a>
      <nav class="links" aria-label="Legal">
        <a href="/privacy-policy">Privacy Policy</a>
        <a href="/terms-of-use">Terms of Use</a>
      </nav>
    </section>

    <figure class="device">
      <img src="assets/phone.webp?v=4" width="1389" height="2373" fetchpriority="high"
           alt="Android lock screen with Tangelo notifications showing a grocery list: Apples, Grapes, Kiwi, Bulb, Pepper, Cherries, Tomatoes, Carrot">
    </figure>

    <p class="legal">Google Play and the Google Play logo are trademarks of Google LLC.</p>
    </div>
  </main>
</body>
</html>
