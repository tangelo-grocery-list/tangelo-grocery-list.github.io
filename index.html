<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tangelo — Grocery list on your lock screen</title>
  <meta name="description" content="Tangelo is a grocery list with emojis that also lives on your lock screen. Stop unlocking, start shopping. Download it on Google Play.">
  <meta name="theme-color" content="#FAF8F8">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon.svg">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tangelo-grocery-list.github.io/">
  <meta property="og:title" content="Stop unlocking. Start shopping. — Tangelo">
  <meta property="og:description" content="Sticky thumb? Picky scanner? Your grocery list is already on your lock screen.">
  <meta property="og:image" content="https://tangelo-grocery-list.github.io/assets/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="1200">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #FAF8F8;
      --ink: #000;
      --muted: #545459;
      --yellow: #FFCC34;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); }
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    img { display: block; max-width: 100%; height: auto; }

    .hero {
      position: relative;
      min-height: max(100vh, 680px);
      min-height: max(100svh, 680px);
      overflow: hidden;
      display: flex;
      justify-content: center;
      padding: 0 max(24px, 4vw);
    }
    /* Text and phone travel together as one centered group */
    .stage {
      position: relative;
      display: grid;
      grid-template-columns: auto auto;
      align-items: center;
      column-gap: clamp(48px, 6vw, 112px);
    }

    /* Yellow waves — exported from the Figma frame */
    .wave { position: absolute; z-index: 0; pointer-events: none; }
    .wave--top { top: 0; right: 0; width: min(54%, 72vh); }
    .wave--bottom { display: none; } /* mobile only */
    .wave svg { display: block; width: 100%; height: auto; }

    .copy {
      position: relative; z-index: 2;
      display: flex; flex-direction: column; align-items: flex-start;
      padding: 72px 0;
    }
    .app-head {
      display: flex; align-items: center;
      gap: clamp(14px, 1.4vw, 22px);
      margin-bottom: clamp(20px, 2.2vw, 32px);
    }
    .app-icon {
      width: clamp(64px, 6.2vw, 96px);
      border-radius: 22%;
      box-shadow: 0 2px 4px rgba(0,0,0,.18);
    }
    .app-name {
      font-weight: 700;
      font-size: clamp(1.5rem, 2.4vw, 2.25rem);
      letter-spacing: -0.01em;
    }
    h1 {
      font-weight: 700;
      font-size: clamp(2.5rem, 5vw, 4.75rem);
      line-height: 1.12;
      letter-spacing: -0.02em;
    }
    h1 span { display: block; }
    .sub {
      margin-top: clamp(16px, 1.8vw, 24px);
      font-weight: 500;
      font-size: clamp(1.125rem, 1.75vw, 1.625rem);
      line-height: 1.35;
      color: var(--muted);
    }
    .sub span { display: block; }
    .brand { display: none; } /* mobile only */
    .emoji {
      display: flex; gap: clamp(10px, 1.1vw, 16px);
      margin-top: clamp(20px, 2.2vw, 28px);
      list-style: none;
    }
    .emoji img { width: clamp(32px, 3vw, 44px); }
    .store {
      display: inline-block;
      margin-top: clamp(28px, 3.2vw, 44px);
      border-radius: 10px;
      transition: transform .15s ease;
    }
    .store:hover { transform: translateY(-2px); }
    .store:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
    .store img { width: clamp(190px, 17vw, 250px); }

    .device {
      position: relative; z-index: 1;
      align-self: end;
      justify-self: center;
      width: min(600px, 68vh, 42vw);
      padding-top: 8vh;
    }
    .device img { width: 100%; }

    .legal {
      margin-top: 12px;
      font-size: 12px; line-height: 1.4;
      color: var(--muted);
    }

    @media (max-width: 820px) {
      .hero {
        min-height: 100vh;
        min-height: 100svh; /* phone and wave always reach the bottom of the screen */
        padding: 0 24px;
      }
      .stage { grid-template-columns: 1fr; width: 100%; }
      /* no icon on mobile: its space is split above and below the text, so page height stays the same */
      .app-head { display: none; }
      .copy {
        padding: 28px 0 0;
        align-items: center;
        text-align: center;
      }
      /* order on mobile: brand, headline, subline, badge, legal */
      .brand {
        order: 0;
        display: flex; align-items: center; gap: 10px;
        font-weight: 700; font-size: 1.25rem; letter-spacing: -0.01em;
      }
      .brand img { width: 32px; border-radius: 22%; box-shadow: 0 1px 2px rgba(0,0,0,.18); }
      .emoji { display: none; }
      h1 { order: 2; margin-top: 16px; font-size: clamp(2.125rem, 10vw, 2.5rem); }
      .sub { order: 3; }
      .store { order: 4; margin-top: 24px; }
      .store img { width: 156px; } /* ~46px tall: above Google's 28px minimum and a comfortable tap target */
      .legal { order: 5; }
      .wave--top { display: none; }
      .wave--bottom { display: block; bottom: 0; width: 160%; left: -30%; }
      .device { width: min(100%, 440px); padding-top: 28px; justify-self: center; }
    }
    @media (prefers-reduced-motion: reduce) {
      .store { transition: none; }
    }
  </style>
</head>
<body>
  <main class="hero">
    <div class="wave wave--bottom" aria-hidden="true">
      <svg viewBox="0 0 2839 674" preserveAspectRatio="xMinYMax meet"><path d="M2838.25 673.452C1134.94 298.599 114.457 -633.483 -665.981 673.451L2838.25 673.452Z" fill="#FFCC34"/></svg>
    </div>
    <div class="wave wave--top" aria-hidden="true">
      <svg viewBox="0 0 1722 619" preserveAspectRatio="xMaxYMin meet"><path d="M0 0.000610352C1008.71 931.782 2116.57 709.527 2884.68 0L0 0.000610352Z" fill="#FFCC34"/></svg>
    </div>

    <div class="stage">
    <section class="copy">
      <div class="app-head">
        <img class="app-icon" src="assets/icon.svg" width="96" height="96" alt="">
        <span class="app-name">Tangelo</span>
      </div>
      <div class="brand"><img src="assets/icon.svg" width="32" height="32" alt=""><span>Tangelo</span></div>
      <h1><span>Stop unlocking.</span> <span>Start shopping.</span></h1>
      <p class="sub"><span>Sticky thumb? Picky scanner?</span> <span>Your list is already on screen.</span></p>
      <ul class="emoji" aria-hidden="true">
        <li><img src="assets/lemon.webp" width="44" height="44" alt=""></li>
        <li><img src="assets/mango.webp" width="44" height="44" alt=""></li>
        <li><img src="assets/blueberries.webp" width="44" height="44" alt=""></li>
        <li><img src="assets/apple.webp" width="44" height="44" alt=""></li>
      </ul>
      <a class="store" href="https://play.google.com/store/apps/details?id=app.grocery.list">
        <img src="assets/google-play-badge.png" width="250" height="74" alt="Get it on Google Play">
      </a>
      <p class="legal">Google Play and the Google Play logo<br>are trademarks of Google LLC.</p>
    </section>

    <figure class="device">
      <img src="assets/phone.webp" width="1360" height="1713" fetchpriority="high"
           alt="Android phone with Tangelo notifications showing a grocery list: Apples, Grapes, Kiwi, Strawberry, Pear, Pineapple, Cherries">
    </figure>
    </div>
  </main>
</body>
</html>
