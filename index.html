<title>Tangelo — Grocery list with emojis</title>

<style>
  :root {
    --bg: #FAF8F8;
    --ink: #000;
    --sun: #FFCC34;
    --muted: #6B6766;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    --s: min(100vw, 110vh);
    position: relative;
    min-height: 100vh;
    min-height: 100svh;
    overflow: hidden;
    display: grid;
    place-items: center;
    padding: calc(var(--s) * 0.12 + env(safe-area-inset-top, 0px)) 24px calc(var(--s) * 0.17 + env(safe-area-inset-bottom, 0px));
  }
  /* Waves: geometry from the Instagram slide; height follows the smaller screen side,
     width stretches with the viewport so wide screens stay balanced */
  .wave { position: absolute; display: block; pointer-events: none; }
  .wave--top    { top: 0; left: 46.2%; width: 90.1%; height: max(calc(var(--s) * 0.193), 12vh); }
  .wave--bottom { bottom: 0; left: -20.8%; width: 109.5%; height: max(calc(var(--s) * 0.21), 13vh); }

  main {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  /* All sizes follow the slide: 1 unit = artboard px / 3200 * --s */
  h1 {
    font-weight: 700;
    font-size: max(2.25rem, calc(var(--s) * 0.053));
    line-height: 1.15;
    letter-spacing: -0.01em;
  }
  .emoji {
    display: block;
    margin-top: max(0.9rem, calc(var(--s) * 0.034));
    width: max(180px, calc(var(--s) * 0.224));
    height: auto;
  }
  .app {
    margin-top: max(1.5rem, calc(var(--s) * 0.04));
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .app svg {
    display: block;
    width: max(125px, calc(var(--s) * 0.192));
    height: auto;
    filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .18));
  }
  .app-name {
    margin-top: max(0.4rem, calc(var(--s) * 0.008));
    font-weight: 500;
    font-size: max(1.75rem, calc(var(--s) * 0.05));
    line-height: 1.2;
  }
  .badge {
    margin-top: max(1.1rem, calc(var(--s) * 0.025));
    display: inline-block;
    border-radius: 12px;
    transition: transform .15s ease;
  }
  .badge svg { display: block; width: max(200px, calc(var(--s) * 0.344)); height: auto; }
  .badge:hover { transform: translateY(-2px); }
  .badge:active { transform: translateY(0); }
  .badge:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }

  footer {
    position: absolute;
    z-index: 1;
    left: 0; right: 0;
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    padding: 0 24px;
    text-align: center;
    font-size: 12px;
    line-height: 1.4;
    color: rgba(0,0,0,.6);
  }
  @media (prefers-reduced-motion: reduce) {
    .badge { transition: none; }
    .badge:hover { transform: none; }
  }
</style>
</head>
